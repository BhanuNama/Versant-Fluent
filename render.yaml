services:
  - type: web
    name: fluentpath
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: EMBEDDINGS
        value: overlap
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: COOKIE_SAMESITE
        value: lax
      - key: COOKIE_SECURE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
